<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Uso del Button-Groups</title>
    <meta name="description" content="Aquí se mostrarán algunos ejemplos de uso del Button-Groups">
    <meta name="author" content="Alberto Díaz">
    <meta name="keywords" content="button, groups">

</head>
<body>

<header>
    <h1>BUTTON-GROUPS</h1>
</header>


<main>

    <section>
        <h2>Ejemplos</h2>
        <p>Bootstrap 5 te permite agrupar una serie de botones todos juntos en un solo grupo</p>
        <div class="contenedor">
            <div class="grupo">    
                <button type="button" class="boton-primario">Microsoft</button>
                <button type="button" class="boton-primario">Sony</button>
                <button type="button" class="boton-primario">Nintendo</button>
            </div>
        </div>

        <div class="container mt-3">
  <h2>Button Groups Sizes</h2>
  <p>Add class .btn-group-* to size all buttons in a button group.</p>
  <h3>Large Buttons:</h3>
  <div class="btn-group btn-group-lg">
    <button type="button" class="btn btn-primary">Apple</button>
    <button type="button" class="btn btn-primary">Samsung</button>
    <button type="button" class="btn btn-primary">Sony</button>
  </div>
    </section>


</main>

<footer>
    © 2026
</footer>

</body>
</html>
